<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" width="240" height="50">
  <defs>
    <!-- Ethiopian Flag Gradient for the Briefcase / Hexagon Badge -->
    <linearGradient id="ethioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#009A44"/>   <!-- Green -->
      <stop offset="50%" stop-color="#FED100"/>  <!-- Yellow -->
      <stop offset="100%" stop-color="#EF3340"/> <!-- Red -->
    </linearGradient>

    <!-- Modern Deep Indigo / Cyan Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>

    <!-- Glow for Icon -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- ICON CONTAINER -->
  <g filter="url(#glow)">
    <!-- Rounded Squircle Badge -->
    <rect x="4" y="5" width="40" height="40" rx="12" fill="url(#ethioGrad)"/>
    <rect x="6" y="7" width="36" height="36" rx="10" fill="#111827"/>
    
    <!-- Briefcase Symbol with Ethiopian Flag Accent -->
    <!-- Handle -->
    <path d="M19 18 C19 14.5, 29 14.5, 29 18" fill="none" stroke="#FED100" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Bag Body -->
    <rect x="13" y="18" width="22" height="17" rx="3.5" fill="none" stroke="#ffffff" stroke-width="2.2"/>
    
    <!-- Center Lock / Star Accent -->
    <path d="M24 23 L24 28" stroke="#009A44" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="24" cy="25.5" r="3" fill="#FED100"/>
    <circle cx="24" cy="25.5" r="1.3" fill="#EF3340"/>
  </g>

  <!-- TEXT LOGO: ETHIO JOBS -->
  <!-- "ETHIO" in Bold Premium White -->
  <text x="54" y="32" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="22" letter-spacing="1.2" fill="#ffffff">ETHIO</text>
  
  <!-- "JOBS" in Vibrant Golden Yellow / Cyan Accent -->
  <text x="137" y="32" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="22" letter-spacing="1.2" fill="#FED100">JOBS</text>
  
  <!-- Mini Subtitle: PORTAL with Flag Accent Dot -->
  <text x="55" y="44" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="8.5" letter-spacing="3" fill="#9ca3af">CAREER PORTAL</text>
  <circle cx="168" cy="41.5" r="2" fill="#009A44"/>
  <circle cx="174" cy="41.5" r="2" fill="#FED100"/>
  <circle cx="180" cy="41.5" r="2" fill="#EF3340"/>
</svg>
